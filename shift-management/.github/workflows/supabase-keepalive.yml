name: Supabase keepalive

# Supabase の無料プランはプロジェクトへのアクセスが 7 日間ないと一時停止される。
# それより短い間隔で REST API を読み取り、稼働中とみなさせる。
on:
  schedule:
    # 2 日おき 03:00 UTC (JST 12:00)
    - cron: '0 3 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query assignments table
        env:
          SUPABASE_URL: https://yfurglffuzkffpmodkkq.supabase.co
          SUPABASE_KEY: sb_publishable_DE0zF7_F7kNUt35EAf9-RA_H2K-i-p7
        run: |
          status=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/assignments?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")

          echo "HTTP $status"
          cat /tmp/response.json

          if [ "$status" != "200" ]; then
            echo "::error::Supabase ping failed with HTTP $status"
            exit 1
          fi
